name: React Testing Workflow
on:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

  test:
    runs-on: ubuntu-latest
    steps:
      # Step 4: Run tests
      - name: Run tests
        run: npm test -- --watchAll=false
        working-directory: .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: npm run build

      - name: Deploy
        run: echo "Deploying ..."
